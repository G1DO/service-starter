version: "3"

tasks:
  dev:
    desc: Start the system locally with dependencies
    cmds:
      - docker compose up --build

  test:int:
    desc: Integration suite with real dependencies
    cmds:
      - python3 -m unittest discover -s tests/integration -v

  test:e2e:
    desc: End-to-end probes against compose stack (E2E_BASE_URL) or local server
    cmds:
      - python3 scripts/e2e.py

  test:contract:
    desc: Contract version + compatibility (oasdiff + schemathesis where versioned contract exists)
    cmds:
      - python3 scripts/contract_check.py

  migrate:
    desc: Apply migrations; verify status before and after
    cmds:
      - python3 scripts/migrate.py

  build:
    desc: Build the repeatable delivery artifact
    cmds:
      - docker build -t service-starter:local .

  check:sast:
    desc: Static analysis (Semgrep --error fail-closed; CodeQL default setup covers PRs)
    cmds:
      - semgrep --config auto --error src scripts

  check:secrets:
    desc: Secrets scan (working tree plus history, fail-closed)
    cmds:
      - gitleaks detect --source . -v

  check:audit:
    desc: Dependency audit (stdlib guard plus osv-scanner fail-closed; pip audit when a manifest lands)
    cmds:
      - python3 scripts/audit.py
      - osv-scanner scan source --allow-no-lockfiles -r .

  check:hygiene:
    desc: Placeholders, path alignment, no echo stubs
    cmds:
      - python3 scripts/hygiene.py

  diagrams:
    desc: Validate workspace.dsl via structurizr validate
    cmds:
      - structurizr.sh validate -workspace docs/architecture/workspace.dsl
      - python3 scripts/diagrams.py
      - sh -c '! grep -R -n --include="*.md" -E "mermaid|plantuml" docs'

  verify:
    desc: Full local gate (absent suites omitted, never skipped; migrate excluded — it writes)
    cmds:
      - task: test
      - task: test:int
      - task: test:e2e
      - task: test:contract
      - task: build
      - task: check:sast
      - task: check:secrets
      - task: check:audit
      - task: check:hygiene
      - task: diagrams
