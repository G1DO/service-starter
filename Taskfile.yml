version: "3"

tasks:
  dev:
    desc: Start the system locally with dependencies
    cmds:
      - docker compose up --build

  test:
    desc: Fast required suite (lint + unit)
    cmds:
      - python3 -m compileall -q src tests
      - python3 -m unittest discover -s tests/unit -v

  test:int:
    desc: Integration suite with real dependencies
    cmds:
      - python3 -m unittest discover -s tests/integration -v

  test:e2e:
    desc: End-to-end probes against compose stack (E2E_BASE_URL) or local server
    cmds:
      - python3 scripts/e2e.py

  test:contract:
    desc: Contract version + compatibility (oasdiff + schemathesis where versioned contract exists)
    cmds:
      - python3 scripts/contract_check.py

  migrate:
    desc: Apply migrations; verify status before and after
    cmds:
      - python3 scripts/migrate.py

  build:
    desc: Build the repeatable delivery artifact
    cmds:
      - docker build -t service-starter:local .

  check:sast:
    desc: Static analysis (AST guard always; Semgrep where installed; CodeQL default setup covers PRs)
    cmds:
      - python3 scripts/sast_guard.py
      - sh -c 'if command -v semgrep >/dev/null 2>&1; then semgrep --config auto --error src scripts; else echo "sast - semgrep not installed; AST guard ran above, CodeQL covers PRs"; fi'

  check:secrets:
    desc: Secrets scan (gitleaks where installed + pattern guard)
    cmds:
      - sh -c 'if command -v gitleaks >/dev/null 2>&1; then gitleaks detect --no-git -v ./src ./tests; else echo "secrets - gitleaks not installed; running pattern guard"; fi'
      - python3 scripts/secrets_guard.py

  check:audit:
    desc: Dependency audit (stdlib-only guard; pip audit when a manifest lands)
    cmds:
      - python3 scripts/audit.py

  check:hygiene:
    desc: Placeholders, path alignment, no echo stubs
    cmds:
      - python3 scripts/hygiene.py

  diagrams:
    desc: DSL pointer check (validity via editor extension / Lite preview)
    cmds:
      - python3 scripts/diagrams.py

  verify:
    desc: Full local gate (no state changes; migrate excluded — it writes)
    cmds:
      - task: test
      - task: test:int
      - task: test:e2e
      - task: test:contract
      - task: build
      - task: check:sast
      - task: check:secrets
      - task: check:audit
      - task: check:hygiene
      - task: diagrams
