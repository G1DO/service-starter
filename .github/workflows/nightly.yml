name: nightly
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: go-task/setup-task@v1
      - run: task test
      - run: task test:int
      - run: task test:e2e
      - run: task test:contract
      - run: task build
      - run: task check:sast
      - run: task check:secrets
      - run: task check:audit
      - run: task check:hygiene
      - run: task diagrams
