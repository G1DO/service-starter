name: ci
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read
env:
  SEMGREP_VERSION: 1.181.0
  SEMGREP_SHA256: c142ec04a2ed144970cb0a92f6877651dd3c088505eec737bb7f4db7ae5f0ffa
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
  OASDIFF_VERSION: 1.33.0
  OASDIFF_SHA256: 43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247
  STRUCTURIZR_CLI_VERSION: 2025.11.09
  STRUCTURIZR_CLI_SHA256: f5365a463fc44d539ed19bec00c48ba1e1ecda0ccfd1ba40d2e7472d264eb79a

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - run: |
          set -euo pipefail
          pip download --no-deps --only-binary=:all: -d /tmp/semgrep-pin "semgrep==${SEMGREP_VERSION}"
          WHEEL=$(ls /tmp/semgrep-pin/semgrep-"${SEMGREP_VERSION}"-*manylinux_2_34_x86_64.whl)
          echo "${SEMGREP_SHA256}  ${WHEEL}" | sha256sum -c -
          pip install "semgrep==${SEMGREP_VERSION}"
          test "$(semgrep --version)" = "${SEMGREP_VERSION}"
      - run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - run: |
          set -euo pipefail
          curl -fsSL -o /tmp/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          sudo chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version
      - run: |
          set -euo pipefail
          curl -fsSL -o /tmp/oasdiff.tar.gz "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  /tmp/oasdiff.tar.gz" | sha256sum -c -
          tar xzf /tmp/oasdiff.tar.gz -C /tmp oasdiff
          sudo mv /tmp/oasdiff /usr/local/bin/oasdiff
          oasdiff --version
      - run: |
          set -euo pipefail
          mkdir -p "$HOME/structurizr-cli"
          curl -fsSL -o /tmp/structurizr-cli.zip "https://github.com/structurizr/cli/releases/download/v${STRUCTURIZR_CLI_VERSION}/structurizr-cli.zip"
          echo "${STRUCTURIZR_CLI_SHA256}  /tmp/structurizr-cli.zip" | sha256sum -c -
          unzip -q -o /tmp/structurizr-cli.zip -d "$HOME/structurizr-cli"
          test -x "$HOME/structurizr-cli/structurizr.sh"
          echo "$HOME/structurizr-cli" >> "$GITHUB_PATH"
      - run: task verify

  gate:
    if: ${{ !cancelled() }}
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -c "import json, os, sys; needs=json.loads(os.environ['NEEDS']); required={'verify'}; bad=[k for k,v in needs.items() if v.get('result') in ('failure','cancelled')]; bad+=[k for k in required if needs.get(k,{}).get('result')!='success']; print(bad); sys.exit(1 if bad else 0)"
