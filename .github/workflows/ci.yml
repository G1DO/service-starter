name: ci
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.filter.outputs.data }}
      contracts: ${{ steps.filter.outputs.contracts }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            data: ['src/auth/**', 'src/data/**', 'src/infra/**', 'migrations/**', 'infra/**']
            full: ['.github/workflows/**', 'Taskfile*', 'Makefile', 'Dockerfile*', 'docker-compose*', '**/seed*']
            contracts: ['docs/contracts/**', 'openapi/**']

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-task@v2
      - run: task test

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-task@v2
      - run: task check:sast

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-task@v2
      - run: task check:secrets

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-task@v2
      - run: task check:audit

  integration:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.data == 'true' || needs.changes.outputs.full == 'true' || contains(github.event.pull_request.labels.*.name, 'force-integration')
    needs: [changes, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-task@v2
      - run: task test:int

  e2e:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.full == 'true' || contains(github.event.pull_request.labels.*.name, 'force-e2e')
    needs: [changes, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-task@v2
      - run: task test:e2e

  contract-check:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.full == 'true' || contains(github.event.pull_request.labels.*.name, 'force-contract')
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-task@v2
      - run: task test:contract

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-task@v2
      - run: task build

  arch-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-task@v2
      - run: task diagrams

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-task@v2
      - run: task check:hygiene

  gate:
    if: ${{ !cancelled() }}
    needs: [changes, test, contract-check, sast, secrets-scan, audit, integration, e2e, build, arch-validate, hygiene]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -c "import json, os, sys; needs=json.loads(os.environ['NEEDS']); required={'changes','test','sast','secrets-scan','audit','build','arch-validate','hygiene'}; bad=[k for k,v in needs.items() if v.get('result') in ('failure','cancelled')]; bad+=[k for k in required if needs.get(k,{}).get('result')!='success']; print(bad); sys.exit(1 if bad else 0)"
